<ion-header>
  <ion-toolbar color="primary">
    <ion-title>I Nostri Menu</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding app-background">
  
  <div class="ion-text-center ion-padding-bottom">
    <ion-text>
      <p style="color: var(--app-text);">Scegli una delle nostre combo speciali e risparmia!</p>
    </ion-text>
  </div>

  <!-- Griglia Responsive -->
  <ion-grid fixed>
    <ion-row>
      <!-- Su smartphone (size="12") occupa tutta la riga, su tablet/PC (size-md="6") si affiancano -->
      <ion-col size="12" size-md="6" *ngFor="let combo of listaMenu">
        
        <ion-card class="menu-card">
          
          <!-- ion-img ottimizzato di Ionic -->
          <ion-img *ngIf="combo.immagine_url" [src]="combo.immagine_url" alt="{{ combo.nome }}" class="menu-img"></ion-img>

          <ion-card-header>
            <div class="header-container">
              <div>
                <ion-card-title class="menu-title">{{ combo.nome }}</ion-card-title>
              </div>
              <ion-badge color="secondary" class="price-badge">
                {{ combo.prezzo | currency:'EUR':'symbol':'1.2-2' }}
              </ion-badge>
            </div>
          </ion-card-header>

          <ion-card-content>
            <p class="menu-description">{{ combo.descrizione }}</p>
            
            <ion-button expand="block" color="primary" class="ion-margin-top">
              <ion-icon name="cart-outline" slot="start"></ion-icon>
              Aggiungi al Carrello
            </ion-button>
          </ion-card-content>

        </ion-card>

      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Messaggio se la lista è vuota -->
  <div *ngIf="listaMenu.length === 0" class="ion-text-center ion-padding">
    <p style="color: var(--app-text);">Nessun menu disponibile al momento.</p>
  </div>

</ion-content>
