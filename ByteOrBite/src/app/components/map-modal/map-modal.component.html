<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="cancel()" class="header-btn">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="modal-title">Scegli Posizione</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="confirm()" [disabled]="!selectedCoords" fill="solid" class="header-confirm-btn">
        <ion-icon slot="start" name="checkmark-outline"></ion-icon>
        <span>Conferma</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false">
  <!-- Search Overlay -->
  <div class="search-container">
    <ion-searchbar 
      [(ngModel)]="searchQuery" 
      (ionInput)="onSearchInput($event)"
      (search)="searchAddress()"
      (ionClear)="clearSearch()"
      placeholder="Cerca via, città..." 
      [debounce]="400"
      animated="true">
    </ion-searchbar>

    <!-- Search Results / Suggestions Dropdown -->
    <div class="search-results-card" *ngIf="searchResults.length > 0">
      <ion-list lines="full">
        <ion-item button *ngFor="let result of searchResults" (click)="selectSearchResult(result)">
          <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
          <ion-label class="ion-text-wrap">
            {{ result.display_name }}
          </ion-label>
        </ion-item>
      </ion-list>
    </div>
  </div>

  <!-- Google Maps iFrame -->
  <div class="map-wrapper" [class.dark-map]="isDarkMode$ | async" *ngIf="mapUrl">
    <iframe
      [src]="mapUrl"
      width="100%"
      height="100%"
      frameborder="0"
      style="border:0;"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <div class="map-loading" *ngIf="!mapUrl">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Caricamento mappa Google Maps...</p>
  </div>

  <!-- Locate GPS Floating Button -->
  <button 
    type="button" 
    class="locate-btn" 
    (click)="getCurrentLocation()" 
    title="Centra sulla mia posizione" 
    aria-label="Centra sulla mia posizione">
    <ion-spinner *ngIf="isLocating" name="crescent" color="primary"></ion-spinner>
    <ion-icon *ngIf="!isLocating" name="locate-outline"></ion-icon>
  </button>
</ion-content>
