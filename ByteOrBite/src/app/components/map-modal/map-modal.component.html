<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Scegli Posizione</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="confirm()" [disabled]="!selectedCoords">
        <ion-icon slot="icon-only" name="checkmark-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false">
  <!-- Search Overlay -->
  <div class="search-container">
    <ion-searchbar 
      [(ngModel)]="searchQuery" 
      (ionInput)="onSearchInput($event)"
      (search)="searchAddress()"
      (ionClear)="clearSearch()"
      placeholder="Cerca via, città..." 
      [debounce]="400"
      animated="true">
    </ion-searchbar>

    <!-- Search Results / Suggestions Dropdown -->
    <div class="search-results-card" *ngIf="searchResults.length > 0">
      <ion-list lines="full">
        <ion-item button *ngFor="let result of searchResults" (click)="selectSearchResult(result)">
          <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
          <ion-label class="ion-text-wrap">
            {{ result.display_name }}
          </ion-label>
        </ion-item>
      </ion-list>
    </div>
  </div>

  <!-- Google Maps iFrame -->
  <div class="map-wrapper" [class.dark-map]="isDarkMode$ | async" *ngIf="mapUrl">
    <iframe
      [src]="mapUrl"
      width="100%"
      height="100%"
      frameborder="0"
      style="border:0;"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <div class="map-loading" *ngIf="!mapUrl">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Caricamento mappa Google Maps...</p>
  </div>

  <!-- Locate GPS Floating Button -->
  <ion-button class="locate-btn" (click)="getCurrentLocation()" fill="solid" shape="round">
    <ion-spinner *ngIf="isLocating" name="crescent" color="primary"></ion-spinner>
    <ion-icon *ngIf="!isLocating" slot="icon-only" name="locate-outline"></ion-icon>
  </ion-button>

  <!-- Address Info Bottom Overlay -->
  <div class="address-overlay" *ngIf="selectedAddress || isGeocoding">
    <div class="address-text">
      <span *ngIf="isGeocoding" class="geocoding-text">
        <ion-spinner name="dots" color="primary"></ion-spinner>
        <span>Recupero indirizzo...</span>
      </span>
      <span *ngIf="!isGeocoding">{{ selectedAddress }}</span>
    </div>
  </div>
</ion-content>
