<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Le Nostre Bibite</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding app-background">
  
  <div class="ion-text-center ion-padding-bottom">
    <ion-text>
      <p style="color: var(--app-text);">Rinfrescati con le nostre bibite!</p>
    </ion-text>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="6" size-md="4" size-lg="3" size-xl="2" *ngFor="let bibita of listaBibite" class="menu-col">
        
        <ion-card class="menu-card" [style.opacity]="bibita.disponibile == 0 ? '0.6' : '1'">
          
          <div class="img-wrapper" style="position: relative;">
            <div *ngIf="bibita.disponibile == 0" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 10; display: flex; align-items: center; justify-content: center; border-radius: 12px 12px 0 0;">
              <span style="color: white; font-weight: bold; background: var(--ion-color-danger); padding: 4px 8px; border-radius: 4px; font-size: 0.9em;">NON DISPONIBILE</span>
            </div>
            <ion-img [src]="getImageUrl(bibita.immagine_url)" alt="{{ bibita.nome }}" class="menu-img"></ion-img>
          </div>

          <ion-card-header>
            <div class="header-container">
              <div class="title-container">
                <ion-card-title class="menu-title">{{ bibita.nome }}</ion-card-title>
              </div>
              <ion-badge color="secondary" class="price-badge">
                {{ bibita.prezzo | currency:'EUR':'symbol':'1.2-2' }}
              </ion-badge>
            </div>
          </ion-card-header>

          <ion-card-content>
            <p class="menu-description" [innerHTML]="bibita.descrizione || '&nbsp;'"></p>
            
            <div class="quantity-selector" (click)="$event.stopPropagation()">
              <ion-button fill="clear" color="danger" (click)="bibita.disponibile != 0 ? decrementQuantity(bibita) : null" [disabled]="cartQuantities[bibita.id] === 0 || bibita.disponibile == 0">
                <ion-icon [name]="cartQuantities[bibita.id] === 1 ? 'trash' : 'remove'"></ion-icon>
              </ion-button>
              
              <span class="quantity-text">{{ cartQuantities[bibita.id] || 0 }}</span>
              
              <ion-button fill="clear" color="success" (click)="bibita.disponibile != 0 ? incrementQuantity(bibita) : null" [disabled]="bibita.disponibile == 0">
                <ion-icon name="add"></ion-icon>
              </ion-button>
            </div>
          </ion-card-content>

        </ion-card>

      </ion-col>
    </ion-row>
  </ion-grid>

  <div *ngIf="listaBibite.length === 0" class="ion-text-center ion-padding">
    <p style="color: var(--app-text);">Nessuna bibita disponibile al momento.</p>
  </div>

  <div class="bottom-spacer"></div>

</ion-content>
